<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="40%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="androidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3ddc84" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="npuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadows and Glow Filter -->
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="chipGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg-grid { stroke: #1e293b; stroke-width: 1; stroke-opacity: 0.25; }
    .stream-line { stroke: url(#streamGrad); stroke-width: 2; stroke-dasharray: 80 160; animation: streamAnim 6s linear infinite; }
    .pulse-glow { animation: pulse 3s ease-in-out infinite alternate; }
    .floating-card { animation: float 4s ease-in-out infinite alternate; }
    .floating-card-delay { animation: float 4.5s ease-in-out 1.5s infinite alternate; }
    .orbit-point { animation: orbit 8s linear infinite; }

    @keyframes streamAnim {
      0% { stroke-dashoffset: 240; }
      100% { stroke-dashoffset: -240; }
    }
    @keyframes pulse {
      0% { opacity: 0.35; transform: scale(0.98); }
      100% { opacity: 0.75; transform: scale(1.02); }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-7px); }
    }
    @keyframes orbit {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: 400; }
    }
  </style>

  <!-- Deep Sci-Fi Ambient Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Geometric Grid Texture -->
  <g class="bg-grid">
    <line x1="100" y1="0" x2="100" y2="420" />
    <line x1="250" y1="0" x2="250" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="550" y1="0" x2="550" y2="420" />
    <line x1="700" y1="0" x2="700" y2="420" />
    <line x1="850" y1="0" x2="850" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
    <line x1="1150" y1="0" x2="1150" y2="420" />
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
  </g>

  <!-- Dynamic Data Streams (Background layer behind text) -->
  <path d="M 0 110 Q 300 160 600 110 T 1200 110" fill="none" class="stream-line" opacity="0.6" />
  <path d="M 0 310 Q 300 260 600 310 T 1200 310" fill="none" class="stream-line" opacity="0.6" style="animation-duration: 4.5s;" />
  <path d="M 800 50 C 950 120 1050 280 1200 340" fill="none" class="stream-line" opacity="0.4" style="animation-duration: 7s;" />

  <!-- Ambient Light Halos -->
  <circle cx="180" cy="120" r="140" fill="#38bdf8" filter="url(#dropGlow)" opacity="0.08" class="pulse-glow" />
  <circle cx="980" cy="200" r="180" fill="#818cf8" filter="url(#dropGlow)" opacity="0.1" class="pulse-glow" />

  <!-- Right Visual Graphics: Modern Mobile On-Device AI Architecture (Background/Side) -->
  <g transform="translate(820, 50)" class="floating-card">
    <!-- Phone Mockup Outline with Tech Bevel -->
    <rect x="50" y="20" width="220" height="310" rx="28" fill="#0b1120" stroke="#334155" stroke-width="2.5" />
    <rect x="62" y="32" width="196" height="286" rx="20" fill="#070c18" stroke="#1e293b" stroke-width="1.5" />
    <!-- Dynamic Notch / Pill -->
    <rect x="125" y="42" width="70" height="12" rx="6" fill="#1e293b" />
    <circle cx="137" cy="48" r="3" fill="#38bdf8" />
    
    <!-- Central NPU Chip Core -->
    <rect x="95" y="105" width="130" height="120" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#chipGlow)" />
    <!-- Glowing Circuit Lines inside Chip -->
    <line x1="160" y1="85" x2="160" y2="105" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2" />
    <line x1="160" y1="225" x2="160" y2="245" stroke="#3ddc84" stroke-width="2" stroke-dasharray="4 2" />
    <line x1="75" y1="165" x2="95" y2="165" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 2" />
    <line x1="225" y1="165" x2="245" y2="165" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 2" />

    <text x="160" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="14" fill="#38bdf8" letter-spacing="1.5">ON-DEVICE NPU</text>
    <text x="160" y="168" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" fill="#ffffff">LLM ENGINE</text>
    <text x="160" y="190" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#3ddc84">45.8 tok/sec</text>

    <!-- Mini Telemetry Badges inside Screen -->
    <rect x="78" y="248" width="75" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="115" y="264" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#94a3b8">RAM: 3.2 GB</text>

    <rect x="167" y="248" width="75" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="204" y="264" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#f59e0b">Q4_K_M</text>
    
    <!-- Status Dot -->
    <circle cx="160" cy="294" r="4" fill="#3ddc84">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Interactive Floating Ecosystem Feature Chips (Side) -->
  <g transform="translate(1030, 75)" class="floating-card-delay">
    <rect x="0" y="0" width="135" height="34" rx="17" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="18" cy="17" r="5" fill="#38bdf8" />
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#e2e8f0">Snapdragon QNN</text>
  </g>

  <g transform="translate(740, 290)" class="floating-card">
    <rect x="0" y="0" width="125" height="34" rx="17" fill="url(#cardGrad)" stroke="#3ddc84" stroke-width="1.2" />
    <circle cx="18" cy="17" r="5" fill="#3ddc84" />
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#e2e8f0">Vulkan &amp; Metal</text>
  </g>

  <g transform="translate(1015, 305)" class="floating-card-delay">
    <rect x="0" y="0" width="145" height="34" rx="17" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.2" />
    <circle cx="18" cy="17" r="5" fill="#f59e0b" />
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#e2e8f0">100% Offline RAG</text>
  </g>

  <!-- FOREGROUND HERO HEADER & TEXT (Guaranteed Unobscured & Crisp) -->
  <g transform="translate(60, 48)">
    <!-- Top Pill / Badge -->
    <rect x="0" y="0" width="285" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="15" cy="15" r="4.5" fill="#3ddc84">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#38bdf8" letter-spacing="1">AWESOME ON-DEVICE AI ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="url(#textGrad)" letter-spacing="-1">
      Mobile LLM &amp; Android
    </text>
    <text x="0" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="-1">
      On-Device AI
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="15" fill="#cbd5e1">
      High-performance local inference runtimes, Termux harnesses &amp; mobile AI stacks
    </text>
    <text x="0" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="13.5" fill="#94a3b8">
      Empowering private, zero-latency SLMs/VLMs across Qualcomm Hexagon, Mali, and Apple Silicon.
    </text>

    <!-- Tech Stack Pill Group -->
    <g transform="translate(0, 235)">
      <!-- Tech Pill 1 -->
      <rect x="0" y="0" width="95" height="28" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="47" y="18" text-anchor="middle" font-family="Consolas, monospace" font-weight="600" font-size="11.5" fill="#38bdf8">llama.cpp</text>

      <!-- Tech Pill 2 -->
      <rect x="105" y="0" width="85" height="28" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="147" y="18" text-anchor="middle" font-family="Consolas, monospace" font-weight="600" font-size="11.5" fill="#3ddc84">ExecuTorch</text>

      <!-- Tech Pill 3 -->
      <rect x="200" y="0" width="80" height="28" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="240" y="18" text-anchor="middle" font-family="Consolas, monospace" font-weight="600" font-size="11.5" fill="#a78bfa">MLC-LLM</text>

      <!-- Tech Pill 4 -->
      <rect x="290" y="0" width="75" height="28" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="327" y="18" text-anchor="middle" font-family="Consolas, monospace" font-weight="600" font-size="11.5" fill="#fb923c">LiteRT</text>

      <!-- Tech Pill 5 -->
      <rect x="375" y="0" width="65" height="28" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="407" y="18" text-anchor="middle" font-family="Consolas, monospace" font-weight="600" font-size="11.5" fill="#f43f5e">MNN</text>

      <!-- Tech Pill 6 -->
      <rect x="450" y="0" width="75" height="28" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="487" y="18" text-anchor="middle" font-family="Consolas, monospace" font-weight="600" font-size="11.5" fill="#38bdf8">Termux</text>

      <!-- Tech Pill 7 -->
      <rect x="535" y="0" width="70" height="28" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="570" y="18" text-anchor="middle" font-family="Consolas, monospace" font-weight="600" font-size="11.5" fill="#e2e8f0">GGUF</text>
    </g>

    <!-- Bottom Feature Status Bar -->
    <g transform="translate(0, 285)">
      <text x="0" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#64748b">
        ⚡ Hardware Accelerated (QNN / Vulkan / OpenCL / Metal) &nbsp;•&nbsp; 🔒 100% Offline Privacy &nbsp;•&nbsp; 🔋 Battery Optimized
      </text>
    </g>
  </g>
</svg>
